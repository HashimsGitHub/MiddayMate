name: Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'app/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/deploy.yml'

env:
  REGISTRY: ${{ secrets.ACR_SERVER }}
  IMAGE_NAME: middaymate

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.ACR_SERVER }}/${{ env.IMAGE_NAME }}:latest
          ${{ secrets.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Update Container App
      run: |
        az containerapp update \
          --resource-group MiddayMate \
          --name middaymate \
          --image ${{ secrets.ACR_SERVER }}/${{ env.IMAGE_NAME }}:latest

    - name: Verify Deployment
      run: |
        echo "Waiting for Container App to restart..."
        sleep 30
        az containerapp show \
          --resource-group MiddayMate \
          --name middaymate \
          --query properties.latestRevisionFqdn
