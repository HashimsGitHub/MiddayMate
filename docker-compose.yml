version: '3.8'

services:
  middaymate:
    build: .
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      FLASK_APP: run.py
      MONGO_URI: ${MONGO_URI}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    volumes:
      - .:/app
    command: python run.py
